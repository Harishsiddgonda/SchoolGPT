# Render Infrastructure as Code Blueprint
# Organization: RSR Technologies
# Product: SchoolGPT (FastAPI + React + PostgreSQL pgvector)

databases:
  - name: schoolgpt-db
    databaseName: schoolgpt
    user: schoolgpt_admin
    plan: starter
    ipAllowList: []

services:
  # 1. FastAPI REST API Backend
  - type: web
    name: schoolgpt-api
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: schoolgpt-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: ENVIRONMENT
        value: production

  # 2. React + Vite Frontend (Static Site)
  - type: web
    name: schoolgpt-web
    runtime: static
    region: oregon
    buildCommand: cd apps/web && npm install && npm run build
    staticPublishPath: apps/web/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
